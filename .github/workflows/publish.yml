# Publishes this n8n community node package to npm on a vX.Y.Z tag — trusted publishing (OIDC, no tokens in
# secrets) with provenance, as n8n requires for verified community nodes.
# `npm run release` = `n8n-node release`: inside GitHub Actions it runs lint and build, then `npm publish` with provenance.
# Manual run (workflow_dispatch) is always a dry run: tests, lint, `npm pack --dry-run`.
# The node is developed in the planner repository and mirrored here; the shared-layer check runs there.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Test and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # never use caching in release builds

      - name: Resolve version and mode
        id: meta
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "${TAG#v}" != "$PKG_VERSION" ]; then
              echo "::error::tag $TAG does not match package.json version $PKG_VERSION"; exit 1
            fi
            DRY=false
          else
            DRY=true
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "npm $(npm --version), version $PKG_VERSION, dry_run=$DRY"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and unit tests
        run: npm test

      - name: Is this version already in the registry?
        id: registry
        if: steps.meta.outputs.dry_run == 'false'
        run: |
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::$NAME@${{ steps.meta.outputs.version }} is already published — npm publish is skipped"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint and pack (dry run — tarball contents, no registry call)
        if: steps.meta.outputs.dry_run == 'true'
        run: |
          npm run lint
          npm pack --dry-run

      - name: Publish to npm (lint, build, publish with provenance)
        if: steps.meta.outputs.dry_run == 'false' && steps.registry.outputs.exists != 'true'
        run: npm run release
